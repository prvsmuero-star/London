<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Learning · 교사 연결 시험</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f5;color:#192b24;font:16px system-ui,sans-serif}main{max-width:560px;margin:auto;padding:20px}header{background:#173d35;color:#fff;border-radius:18px;padding:22px}h1{font-size:24px;margin:0 0 8px}h2{font-size:20px;margin:0 0 16px}section{background:white;border:1px solid #dce7e1;border-radius:16px;padding:20px;margin-top:16px}label{display:block;margin:14px 0 6px}input,button{font:inherit;border-radius:10px;padding:12px;width:100%}input{border:1px solid #aabbb2}button{border:0;background:#173d35;color:white;margin-top:12px;font-weight:600}button:disabled{opacity:.5}button.secondary{background:#e7f1eb;color:#173d35}p,small{line-height:1.55}small{color:#56665d}#status{white-space:pre-wrap;overflow-wrap:anywhere;background:#eaf4ef;padding:14px;border-radius:10px}article{padding:12px 0;border-bottom:1px solid #e0e9e3}article:last-child{border:0}.code{font-family:monospace;overflow-wrap:anywhere} [hidden]{display:none!important}
</style></head><body><main><header><h1>English Learning</h1>선생님 로그인 · 반 등록 연결 시험</header><section id="login"><h2>선생님 로그인</h2><form id="loginForm"><label for="email">Firebase에서 만든 이메일</label><input id="email" type="email" autocomplete="username" required><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required><button id="loginButton" disabled>로그인</button></form></section><section id="admin" hidden><h2>반 관리</h2><p id="who"></p><button id="logout" class="secondary">로그아웃</button><form id="classForm"><label for="className">반 이름</label><input id="className" maxlength="60" placeholder="예: Level 1 월수반" required><small>반 이름은 Level 1, Level 2처럼 시작해 주세요. 가입 코드는 자동 생성됩니다. 아직 학생 가입에는 사용할 수 없습니다.</small><button id="create" disabled>반 등록</button></form><button id="refresh" class="secondary">등록된 반 새로고침</button><div id="classes"></div></section><section><h2>연결 결과</h2><p id="status" role="status">Firebase를 불러오는 중…</p><small>이 페이지는 교사 인증과 반 저장만 시험합니다. 학생 회원가입, 실제 학습 기록 및 순위 기능은 연결 전입니다.</small></section></main><script type="module">
const cfg={apiKey:"AIzaSyASiMcu1ZiI4D7o3ZjLNPhZQeIuDxGV6dY",authDomain:"london-a9997.firebaseapp.com",projectId:"london-a9997",storageBucket:"london-a9997.firebasestorage.app",messagingSenderId:"296905640071",appId:"1:296905640071:web:bf2ec615d210b4bd81d022"};
const teacherUID='0fxLQmx4YEPXygI8zmqhdlKZW4k2';
const $=id=>document.getElementById(id);const status=s=>$('status').textContent=s;const err=e=>e.code||e.message||'알 수 없는 오류';let auth,db,A,D;
const isTeacher=()=>auth?.currentUser?.uid===teacherUID;
function code(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from(crypto.getRandomValues(new Uint8Array(10)),v=>chars[v&31]).join('')}
async function load(){if(!isTeacher())return; $('create').disabled=true;try{const snap=await D.getDocsFromServer(D.collection(db,'classes'));if(!isTeacher())return;const els=[];for(const doc of snap.docs.sort((a,b)=>String(a.data().name).localeCompare(String(b.data().name),'ko'))){const d=doc.data(),a=document.createElement('article'),b=document.createElement('strong'),p=document.createElement('p');b.textContent=d.name;p.textContent='가입 코드: '+d.joinCode+' · '+d.level;p.className='code';a.append(b,p);els.push(a)}if(!els.length){const p=document.createElement('p');p.textContent='등록된 반이 없습니다.';els.push(p)}$('classes').replaceChildren(...els);status('선생님 인증 성공 · 서버에서 반 목록 읽기 성공');$('create').disabled=false;}catch(e){status('선생님 로그인은 되었지만 반 목록 읽기 실패: '+err(e)+'\nFirestore 규칙 게시 여부를 확인하세요.');}}
try{const [app,aa,dd]=await Promise.all([import('https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js')]);A=aa;D=dd;const fb=app.initializeApp(cfg);auth=A.getAuth(fb);db=D.getFirestore(fb);await A.setPersistence(auth,A.browserSessionPersistence);A.onAuthStateChanged(auth,async user=>{$('admin').hidden=true;$('login').hidden=false;$('classes').replaceChildren();$('create').disabled=true;if(!user){$('loginButton').disabled=false;status('로그인할 수 있습니다.');return}if(user.uid!==teacherUID){await A.signOut(auth);status('등록된 선생님 계정이 아닙니다.');return}$('login').hidden=true;$('admin').hidden=false;$('who').textContent=user.email||'선생님';await load()});
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginButton').disabled=true;try{await A.signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){status('로그인 실패: '+err(e));$('loginButton').disabled=false}finally{$('password').value=''}});
$('logout').onclick=async()=>{try{await A.signOut(auth)}catch(e){status('로그아웃 실패: '+err(e))}};$('refresh').onclick=load;
$('classForm').addEventListener('submit',async e=>{e.preventDefault();if(!isTeacher())return;const name=$('className').value.trim(),m=name.match(/^Level\s+([1-9][0-9]?)\s+\S/i);if(!m){status('반 이름은 Level 1 월수반 형식으로 입력하세요.');return}const level='Level '+m[1];$('create').disabled=true;try{await D.addDoc(D.collection(db,'classes'),{name,level,joinCode:code(),createdAt:D.serverTimestamp()});$('className').value='';await load();if(!$('create').disabled)status('반 등록 성공 · Firebase에 저장되었습니다.')}catch(e){status('반 등록 실패: '+err(e));$('create').disabled=false}});
}catch(e){status('Firebase 초기화 실패: '+err(e)+'\n인터넷 연결과 HTTPS 주소를 확인하세요.');}
</script></body></html>
