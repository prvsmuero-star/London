</style><link rel="manifest" href="london_v1_manifest.json"><meta name="theme-color" content="#173d35"><link rel="apple-touch-icon" href="london_v1_icon192.png"></head><body><main><header><h1>English Learning</h1>학생 회원가입 · 로그인</header><p style="text-align:right"><a href="london_v1_teacher.html">선생님 로그인</a></p>
<section id="access"><h2>학생 로그인</h2><form id="loginForm"><label for="loginName">실명</label><input id="loginName" required maxlength="40" autocomplete="username"><label for="loginPassword">비밀번호</label><input id="loginPassword" required type="password" autocomplete="current-password"><details><summary>동명이인 구분번호 (가입 시 정한 경우만)</summary><label for="loginSuffix">구분번호</label><input id="loginSuffix" maxlength="6" inputmode="numeric"></details><button disabled id="loginButton">로그인</button></form><button class="secondary" id="openSignup">처음 이용하기 · 회원가입</button></section>
<section id="signup" hidden><h2>학생 회원가입</h2><form id="signupForm"><label for="joinCode">반 가입 코드</label><input id="joinCode" required maxlength="10" autocapitalize="characters" autocomplete="off"><label for="name">실명</label><input id="name" required maxlength="40" autocomplete="name"><label for="nickname">닉네임 (공개용)</label><input id="nickname" required minlength="2" maxlength="20" placeholder="한글·영문·숫자·밑줄 2~20자"><label for="pass">비밀번호 (8자 이상)</label><input id="pass" required minlength="8" type="password" autocomplete="new-password"><label for="confirmPass">비밀번호 확인</label><input id="confirmPass" required type="password" autocomplete="new-password"><details id="duplicate"><summary>동명이인인 경우만 구분번호 설정</summary><label for="suffix">숫자 4~6자리 (생일·전화번호 제외)</label><input id="suffix" maxlength="6" inputmode="numeric"><small>이 번호는 최초 설정 후 로그인할 때만 사용합니다.</small></details><button id="joinButton" disabled>가입하기</button></form><button class="secondary" id="back">로그인으로 돌아가기</button></section>
<section id="profile" hidden><h2>학생 홈</h2><p id="studentName"></p><p id="studentClass"></p><p id="studentNick"></p><button id="startLearning" onclick="location.href='london_v1_learn.html'">학습하기 · 순위</button><small>교재와 챕터를 선택하여 학습하세요.</small><button id="logout">로그아웃</button></section><section><h2>연결 결과</h2><p id="status" role="status">Firebase를 불러오는 중…</p><small>통합 시험판 · 실제 학생 배포 전 테스트용입니다.</small></section></main><script type="module">
const cfg={apiKey:"AIzaSyASiMcu1ZiI4D7o3ZjLNPhZQeIuDxGV6dY",authDomain:"london-a9997.firebaseapp.com",projectId:"london-a9997",storageBucket:"london-a9997.firebasestorage.app",messagingSenderId:"296905640071",appId:"1:296905640071:web:bf2ec615d210b4bd81d022"};
const teacherUID='0fxLQmx4YEPXygI8zmqhdlKZW4k2';
const $=id=>document.getElementById(id),status=s=>$('status').textContent=s;
let A,D,auth,db,busy=false;
const normalizeName=s=>s.normalize('NFKC').trim().replace(/\s+/g,' ');
async function alias(name,suffix){const bytes=new TextEncoder().encode(normalizeName(name).toLowerCase()+'\u0000'+suffix);const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),b=>b.toString(16).padStart(2,'0')).join('');return 's'+hash.slice(0,48)+'@student.london.invalid'}
function validSuffix(s){return !s||/^\d{4,6}$/.test(s)}
function show(which){for(const k of ['access','signup','profile'])$(k).hidden=k!==which;}

function message(e){const c=e.code||e.message;return ({'auth/invalid-credential':'이름, 구분번호 또는 비밀번호를 확인해 주세요.','auth/email-already-in-use':'이미 같은 로그인 이름이 있습니다. 본인 계정이면 로그인하고, 동명이인이면 구분번호를 설정하세요.','permission-denied':'가입 코드가 없거나 비활성화되었거나 닉네임이 이미 사용 중입니다. 선생님에게 확인하세요.','auth/too-many-requests':'요청이 너무 많습니다. 잠시 후 다시 시도하세요.'})[c]||c||'알 수 없는 오류'}
async function showProfile(user){if(!user||user.uid===teacherUID){if(user)await A.signOut(auth);show('access');return false}const snap=await D.getDocFromServer(D.doc(db,'students',user.uid));if(!snap.exists()){show('signup');status('가입이 완료되지 않았습니다. 가입 양식을 다시 입력해 주세요.');return false}const v=snap.data(),cl=await D.getDocFromServer(D.doc(db,'classes',v.classId));$('studentName').textContent='학생: '+v.name;$('studentNick').textContent='닉네임: '+v.nickname;$('studentClass').textContent='소속 반: '+(cl.exists()?cl.data().name:'확인 필요');$('startLearning').disabled=!cl.exists()||cl.data().active===false;show('profile');status(cl.exists()&&cl.data().active!==false?'서버에서 가입 정보 확인 성공':'반이 비활성화되었습니다. 선생님에게 문의하세요.');return true}
try{const [app,aa,dd]=await Promise.all([import('https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js')]);A=aa;D=dd;const fb=app.initializeApp(cfg,'student-test');auth=A.getAuth(fb);db=D.getFirestore(fb);await A.setPersistence(auth,A.browserLocalPersistence);await auth.authStateReady();lock(false);if(auth.currentUser)await showProfile(auth.currentUser);else status('가입 또는 로그인할 수 있습니다.');
$('openSignup').onclick=()=>{show('signup');status('반 가입 코드를 입력해 주세요.')};$('back').onclick=async()=>{if(auth.currentUser)await A.signOut(auth);show('access')};$('logout').onclick=async()=>{await A.signOut(auth);show('access');status('로그아웃 완료')};
$('loginForm').onsubmit=async e=>{e.preventDefault();if(busy)return;const name=normalizeName($('loginName').value),suffix=$('loginSuffix').value.trim();if(!name||!validSuffix(suffix)){status('실명 또는 구분번호를 확인해 주세요.');return}lock(true);try{const cred=await A.signInWithEmailAndPassword(auth,await alias(name,suffix),$('loginPassword').value);await showProfile(cred.user)}catch(e){status('로그인 실패: '+message(e))}finally{$('loginPassword').value='';lock(false)}};
$('signupForm').onsubmit=async e=>{e.preventDefault();if(busy)return;const name=normalizeName($('name').value),nickname=$('nickname').value.normalize('NFKC').trim(),suffix=$('suffix').value.trim(),code=$('joinCode').value.trim().toUpperCase(),pw=$('pass').value;if(!name||name.length>40||!validSuffix(suffix)||!/^[A-HJ-NP-Z2-9]{10}$/.test(code)||!/^[A-Za-z0-9가-힣_]{2,20}$/.test(nickname)||pw.length<8||pw!==$('confirmPass').value){status('가입 코드, 실명, 닉네임, 구분번호 또는 비밀번호 확인을 다시 확인해 주세요.');return}lock(true);let created=false,submitted=false;try{const email=await alias(name,suffix);if(auth.currentUser&&auth.currentUser.email!==email)await A.signOut(auth);if(!auth.currentUser){try{await A.createUserWithEmailAndPassword(auth,email,pw);created=true}catch(e){if(e.code==='auth/email-already-in-use')$('duplicate').open=true;throw e}}else{await A.reauthenticateWithCredential(auth.currentUser,A.EmailAuthProvider.credential(email,pw))}const user=auth.currentUser;if(user.uid===teacherUID)throw Error('교사 계정은 가입할 수 없습니다.');const profile=D.doc(db,'students',user.uid);if((await D.getDocFromServer(profile)).exists()){await showProfile(user);return}const inv=await D.getDocFromServer(D.doc(db,'invites',code));if(!inv.exists())throw Error('가입 코드가 연결되지 않았습니다. 선생님에게 확인하세요.');const classId=inv.data().classId;const batch=D.writeBatch(db);batch.set(profile,{name,nickname,classId,joinCode:code,createdAt:D.serverTimestamp()});batch.set(D.doc(db,'nicknames',nickname),{uid:user.uid});submitted=true;await batch.commit();await showProfile(user)}catch(e){if(created&&!submitted&&auth.currentUser){try{await A.deleteUser(auth.currentUser)}catch{}}status('가입 실패: '+message(e)+' · 계정만 생성된 경우 같은 정보로 로그인하여 가입을 완료하세요.')}finally{$('pass').value='';$('confirmPass').value='';lock(false)}};
}catch(e){status('Firebase 초기화 실패: '+message(e))}
</script><script>if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("london_v1_sw.js").catch(()=>{});</script></body></html>
